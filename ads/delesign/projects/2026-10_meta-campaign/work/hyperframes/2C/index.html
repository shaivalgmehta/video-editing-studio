<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"hookText","type":"string","label":"Hook bar","default":"Not the most creative team."},
    {"id":"ctaHeadline","type":"string","label":"End card headline","default":"The one that shows up"},
    {"id":"ctaButton","type":"string","label":"End card button","default":"Book a call"},
    {"id":"ctaSub","type":"string","label":"End card sub-line","default":"Let’s look at your recurring design workload"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/HankenGrotesk-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Architects Daughter"; src: url("assets/fonts/ArchitectsDaughter-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; background: #000; font-family: "Hanken Grotesk", sans-serif; }
      #cam { position: absolute; inset: 0; overflow: hidden; z-index: 1; background: transparent; box-shadow: 0 12px 36px rgba(30, 41, 59, 0.22); }
      #cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- Ad 2C "The one that shows up". A-roll 22.833 s (settled open, first word at 0.99 s), end card 3 s. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.833" data-width="1080" data-height="1920">
      <div id="ground" style="position: absolute; inset: 0; z-index: 0; background-color: #f8fafc; background-image: radial-gradient(circle, #d7dee8 1.6px, transparent 1.6px); background-size: 30px 30px; background-position: 15px 15px"></div>
      <div id="cam">
        <video id="aroll" class="clip" src="assets/aroll.mp4" data-start="0" data-duration="22.833" data-track-index="0" data-has-audio="true" playsinline></video>
      </div>

      <!-- Graphics scenes -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="6.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="8.7" data-duration="4.6" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="guarantee" data-composition-id="guarantee" data-composition-src="compositions/guarantee.html" data-start="13.3" data-duration="2.9" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="22.833" data-duration="3.0" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 7"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="22.833" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 6"></div>

      <!-- One soft click per card entrance -->
      <audio id="sfx-t" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.89" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-p1" class="clip" src="assets/sfx/click-soft.mp3" data-start="9.70" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-p2" class="clip" src="assets/sfx/click-soft.mp3" data-start="10.49" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-p3" class="clip" src="assets/sfx/click-soft.mp3" data-start="11.66" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-g1" class="clip" src="assets/sfx/click-soft.mp3" data-start="13.5" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-g2" class="clip" src="assets/sfx/click-soft.mp3" data-start="13.95" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/click-soft.mp3" data-start="22.98" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Picture-in-picture from the beat before "And you shouldn't decide" to the beat before "Not the flashiest"
      gsap.set("#cam", { transformOrigin: "0 0" });
      tl.fromTo("#cam", { scale: 1, x: 0, y: 0, borderRadius: 0 }, { scale: 0.2407, x: 755, y: 680, borderRadius: 72, duration: 0.45, ease: "power3.out" }, 6.85);
      tl.set("#cam", { zIndex: 5 }, 7.15);
      tl.set("#cam", { zIndex: 1 }, 16.05);
      tl.to("#cam", { scale: 1, x: 0, y: 0, borderRadius: 0, duration: 0.3, ease: "power2.in" }, 16.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
