<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"hookText","type":"string","label":"Hook bar","default":"Some things just stick."},
    {"id":"ctaHeadline","type":"string","label":"End card headline","default":"Your clients’ brands, remembered"},
    {"id":"ctaButton","type":"string","label":"End card button","default":"Book a call"},
    {"id":"ctaSub","type":"string","label":"End card sub-line","default":"A designer you can rely on"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/HankenGrotesk-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Architects Daughter"; src: url("assets/fonts/ArchitectsDaughter-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; background: #000; font-family: "Hanken Grotesk", sans-serif; }
      #cam { position: absolute; inset: 0; overflow: hidden; z-index: 1; background: transparent; box-shadow: 0 12px 36px rgba(30, 41, 59, 0.22); }
      #cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .broll { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
      .broll video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- Ad 2D "Some things just stick" v2. A-roll 37.967 s (full first line; head comes up from the mic at 0.6 s, first word at 1.79 s), end card 3 s.
         v1 -> v2: everything after the first line shifts +0.634 s. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="40.967" data-width="1080" data-height="1920">
      <div id="ground" style="position: absolute; inset: 0; z-index: 0; background-color: #f8fafc; background-image: radial-gradient(circle, #d7dee8 1.6px, transparent 1.6px); background-size: 30px 30px; background-position: 15px 15px"></div>
      <div id="cam">
        <video id="aroll" class="clip" src="assets/aroll.mp4" data-start="0" data-duration="37.967" data-track-index="0" data-has-audio="true" playsinline></video>
      </div>

      <!-- Phone B-roll under the metaphor ("the first phone number I ever done" / "Some things just stick") and the callback -->
      <div id="broll1-push" class="broll">
        <video id="broll1" class="clip" src="assets/broll/ph01_dial_9x16.mp4" data-start="2.3" data-duration="2.08" data-track-index="1" muted playsinline></video>
      </div>
      <div id="broll2-push" class="broll">
        <video id="broll2" class="clip" src="assets/broll/ph02_dial_9x16.mp4" data-start="4.38" data-duration="1.3" data-track-index="1" muted playsinline></video>
      </div>
      <div id="broll3-push" class="broll">
        <video id="broll3" class="clip" src="assets/broll/ph01_dial_9x16.mp4" data-start="32.23" data-duration="1.35" data-media-start="2" data-track-index="1" muted playsinline></video>
      </div>

      <!-- Graphics scenes -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="8.33" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="memory" data-composition-id="memory" data-composition-src="compositions/memory.html" data-start="8.43" data-duration="2.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="stack" data-composition-id="stack" data-composition-src="compositions/stack.html" data-start="11.13" data-duration="6.3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="context" data-composition-id="context" data-composition-src="compositions/context.html" data-start="17.53" data-duration="14.5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="37.967" data-duration="3.0" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 7"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="37.967" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 6"></div>

      <!-- One soft click per card entrance -->
      <audio id="sfx-m1" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.58" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-s1" class="clip" src="assets/sfx/click-soft.mp3" data-start="11.24" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-s2" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.87" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-s3" class="clip" src="assets/sfx/click-soft.mp3" data-start="15.05" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-c1" class="clip" src="assets/sfx/click-soft.mp3" data-start="17.70" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-c2" class="clip" src="assets/sfx/click-soft.mp3" data-start="20.14" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-c3" class="clip" src="assets/sfx/click-soft.mp3" data-start="24.32" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-c4" class="clip" src="assets/sfx/click-soft.mp3" data-start="26.33" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-c5" class="clip" src="assets/sfx/click-soft.mp3" data-start="29.58" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/click-soft.mp3" data-start="38.12" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#broll1-push", { scale: 1.0 }, { scale: 1.07, duration: 2.08, ease: "none" }, 2.3);
      tl.fromTo("#broll2-push", { scale: 1.08 }, { scale: 1.0, duration: 1.3, ease: "none" }, 4.38);
      tl.fromTo("#broll3-push", { scale: 1.0 }, { scale: 1.07, duration: 1.35, ease: "none" }, 32.23);
      // Picture-in-picture from "Not just the logo" to the phone callback
      gsap.set("#cam", { transformOrigin: "0 0" });
      tl.fromTo("#cam", { scale: 1, x: 0, y: 0, borderRadius: 0 }, { scale: 0.2407, x: 755, y: 680, borderRadius: 72, duration: 0.45, ease: "power3.out" }, 8.23);
      tl.set("#cam", { zIndex: 5 }, 8.53);
      tl.set("#cam", { zIndex: 1 }, 32.23);
      tl.to("#cam", { scale: 1, x: 0, y: 0, borderRadius: 0, duration: 0.3, ease: "power2.in" }, 32.23);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
