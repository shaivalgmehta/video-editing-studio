<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"hookText","type":"string","label":"Hook bar","default":"Two pilots. Two different meals."},
    {"id":"ctaHeadline","type":"string","label":"End card headline","default":"Get a reliable design partner"},
    {"id":"ctaButton","type":"string","label":"End card button","default":"Book a call"},
    {"id":"ctaSub","type":"string","label":"End card sub-line","default":"Ongoing design support for agencies"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/HankenGrotesk-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Architects Daughter"; src: url("assets/fonts/ArchitectsDaughter-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; background: #000; font-family: "Hanken Grotesk", sans-serif; }
      #cam { position: absolute; inset: 0; overflow: hidden; z-index: 1; background: transparent; box-shadow: 0 12px 36px rgba(30, 41, 59, 0.22); }
      #cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .broll { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
      .broll video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- Ad 2B "Co-pilot". A-roll 45.333 s (walk-in pre-roll, first word at 2.06 s), end card 3 s. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="48.167" data-width="1080" data-height="1920">
      <div id="ground" style="position: absolute; inset: 0; z-index: 0; background-color: #f8fafc; background-image: radial-gradient(circle, #d7dee8 1.6px, transparent 1.6px); background-size: 30px 30px; background-position: 15px 15px"></div>
      <div id="cam">
        <video id="aroll" class="clip" src="assets/aroll.mp4" data-start="0" data-duration="45.167" data-track-index="0" data-has-audio="true" playsinline></video>
      </div>

      <!-- Cockpit B-roll under the metaphor, and the callback -->
      <div id="broll1-push" class="broll">
        <video id="broll1" class="clip" src="assets/broll/cp01_takeoff_7s.mp4" data-start="2.86" data-duration="2.74" data-track-index="1" muted playsinline></video>
      </div>
      <div id="broll2-push" class="broll">
        <video id="broll2" class="clip" src="assets/broll/cp02_clouds_6s.mp4" data-start="5.6" data-duration="3.0" data-track-index="1" muted playsinline></video>
      </div>
      <div id="broll3-push" class="broll">
        <video id="broll3" class="clip" src="assets/broll/cp01_takeoff_7s.mp4" data-start="37.87" data-duration="2.4" data-media-start="4" data-track-index="1" muted playsinline></video>
      </div>

      <!-- Graphics scenes -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="8.6" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="stack" data-composition-id="stack" data-composition-src="compositions/stack.html" data-start="11.3" data-duration="5.5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="questions" data-composition-id="questions" data-composition-src="compositions/questions.html" data-start="16.8" data-duration="10.2" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="go2b" data-composition-id="go2b" data-composition-src="compositions/go2b.html" data-start="27.0" data-duration="4.9" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="asks" data-composition-id="asks" data-composition-src="compositions/asks.html" data-start="31.9" data-duration="5.97" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="45.167" data-duration="3.0" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 7"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="45.167" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 6"></div>

      <!-- One soft click per card entrance -->
      <audio id="sfx-s1" class="clip" src="assets/sfx/click-soft.mp3" data-start="11.45" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-s2" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.9" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-s3" class="clip" src="assets/sfx/click-soft.mp3" data-start="14.3" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-q0" class="clip" src="assets/sfx/click-soft.mp3" data-start="16.9" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-q1" class="clip" src="assets/sfx/click-soft.mp3" data-start="18.94" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-q2" class="clip" src="assets/sfx/click-soft.mp3" data-start="20.7" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-q3" class="clip" src="assets/sfx/click-soft.mp3" data-start="22.38" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-q4" class="clip" src="assets/sfx/click-soft.mp3" data-start="24.46" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-go1" class="clip" src="assets/sfx/click-soft.mp3" data-start="27.1" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-a1" class="clip" src="assets/sfx/click-soft.mp3" data-start="33.98" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-a2" class="clip" src="assets/sfx/click-soft.mp3" data-start="34.94" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-a3" class="clip" src="assets/sfx/click-soft.mp3" data-start="37.18" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/click-soft.mp3" data-start="45.32" data-duration="0.37" data-track-index="4" data-volume="0.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#broll1-push", { scale: 1.0 }, { scale: 1.06, duration: 2.74, ease: "none" }, 2.86);
      tl.fromTo("#broll2-push", { scale: 1.08 }, { scale: 1.0, duration: 3.0, ease: "none" }, 5.6);
      tl.fromTo("#broll3-push", { scale: 1.0 }, { scale: 1.07, duration: 2.4, ease: "none" }, 37.87);
      // Picture-in-picture from "The first job looks fine" to the cockpit callback
      gsap.set("#cam", { transformOrigin: "0 0" });
      tl.fromTo("#cam", { scale: 1, x: 0, y: 0, borderRadius: 0 }, { scale: 0.2407, x: 755, y: 680, borderRadius: 72, duration: 0.45, ease: "power3.out" }, 11.1);
      tl.set("#cam", { zIndex: 5 }, 11.4);
      tl.set("#cam", { zIndex: 1 }, 37.87);
      tl.to("#cam", { scale: 1, x: 0, y: 0, borderRadius: 0, duration: 0.3, ease: "power2.in" }, 37.87);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
