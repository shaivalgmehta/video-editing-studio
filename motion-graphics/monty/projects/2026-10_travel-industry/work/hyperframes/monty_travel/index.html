  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Monty eSIM house kit, sampled from the storyboard frames */
      :root {
        --ink: #0b0b0b;
        --navy: #13294b;
        --teal-d: #05658e;
        --teal: #0a7ea8;
        --cyan: #00a5cd;
        --cyan-l: #6cb5cd;
        --purple: #7a58de;
        --lav: #ece7fc;
        --red: #e5203d;
        --red-bg: #fde4e9;
        --green: #1f9a6b;
        --amber: #fbb02b;
        --magenta: #e266b4;
        --font: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e9f2f6;
        font-family: var(--font);
      }
      #root { position: absolute; inset: 0; font-family: var(--font); }
      .ground {
        position: absolute;
        inset: 0;
        background: linear-gradient(118deg, #ffffff 0%, #edf4f7 30%, #d3e8ef 65%, #abdae8 100%);
      }

      /* scene frame */
      .stage { position: absolute; inset: 0; font-family: var(--font); color: var(--ink); }
      .abs { position: absolute; }

      /* type */
      .h { font-size: 81px; line-height: 1.13; letter-spacing: -0.005em; white-space: nowrap; }
      .h.xl { font-size: 116px; }
      .h.md { font-size: 72px; }
      .lt { font-weight: 400; color: var(--ink); }
      .bd { font-weight: 700; color: var(--cyan); }
      .bd.dark { color: var(--teal-d); }
      .w { display: inline-block; white-space: pre; }
      .sub { font-size: 32px; font-weight: 400; color: var(--ink); white-space: nowrap; }
      .eyebrow { font-size: 32px; font-weight: 400; color: var(--ink); }

      /* pills and chips */
      .pill {
        display: inline-flex; align-items: center; height: 60px; padding: 0 28px;
        border-radius: 30px; background: linear-gradient(90deg, #17a4cb, #3ea0c3);
        color: #fff; font-weight: 700; font-size: 27px; white-space: nowrap;
      }
      .chip {
        display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 20px;
        border-radius: 21px; background: #fff; color: var(--teal-d);
        font-weight: 700; font-size: 20px; white-space: nowrap;
      }
      .chip .i { font-size: 17px; color: var(--cyan); }

      /* icons: Font Awesome 6 solid as masks, coloured by currentColor */
      .i {
        display: inline-block; width: 1em; height: 1em; flex: none;
        background: currentColor;
        -webkit-mask: var(--i) center / contain no-repeat;
        mask: var(--i) center / contain no-repeat;
      }
      .tile {
        display: inline-flex; align-items: center; justify-content: center; flex: none;
        width: 52px; height: 52px; border-radius: 12px;
        background: linear-gradient(160deg, #46acce, #a7d7e6); color: #fff; font-size: 26px;
      }
      .tile.lav { background: linear-gradient(160deg, #8d6be6, #c9b8f5); }
      .tile.sq { border-radius: 22px; }
      .disc {
        display: inline-flex; align-items: center; justify-content: center; flex: none;
        width: 100px; height: 100px; border-radius: 50%; color: #fff; font-size: 44px;
      }
      .halo { box-shadow: 0 0 0 12px rgba(0, 165, 205, 0.18); }

      /* cards */
      .card { background: #fff; border-radius: 26px; }
      .row {
        display: flex; align-items: center; gap: 20px; background: #fff;
        border: 2px solid #dfe5ea; border-radius: 22px; padding: 0 24px;
      }
      .row .t1 { font-weight: 700; font-size: 21px; color: var(--teal-d); }
      .row .t2 { font-weight: 400; font-size: 19px; color: var(--navy); margin-top: 3px; }
      .esim {
        background: linear-gradient(90deg, #f3effd, #dcd3f8); border: 2px solid #8a69e4;
      }
      .esim .t1 { color: var(--purple); }
      .btn {
        display: flex; align-items: center; justify-content: center;
        height: 74px; border-radius: 22px; color: #fff; font-weight: 700; font-size: 29px;
        background: linear-gradient(90deg, #0d4c7b, #0787b2);
      }
      .badge-red {
        display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 20px;
        border-radius: 20px; background: var(--red-bg); color: var(--red); font-weight: 700; font-size: 21px;
      }

      /* phone */
      .phone {
        position: absolute; width: 490px; height: 1004px; border-radius: 74px; padding: 12px;
        background: linear-gradient(180deg, #b6dce8 0%, #20aed2 45%, #00a5cd 100%);
      }
      .phone .scr {
        position: relative; width: 100%; height: 100%; border-radius: 64px; overflow: hidden;
        background: linear-gradient(180deg, #ffffff 58%, #c2eaf4 100%);
      }
      .phone .pad { position: absolute; left: 31px; right: 31px; }
      .ph-title { font-weight: 700; font-size: 27px; color: var(--navy); }
      .ph-sub { font-weight: 400; font-size: 18px; color: var(--navy); }
    </style>
    <script>
      // Shared motion helpers for every scene. Pure functions of the scene timeline.
      window.MS = {
        // per word: blur 8 -> 0, faint -> ink, no travel
        words(tl, sel, t, o = {}) {
          return tl.fromTo(sel,
            { opacity: 0, filter: "blur(8px)" },
            { opacity: 1, filter: "blur(0px)", duration: o.d ?? 0.42, ease: "power3.out", stagger: o.s ?? 0.085 }, t);
        },
        // card or block arriving: lands on a long tail
        pop(tl, sel, t, o = {}) {
          return tl.fromTo(sel,
            { opacity: 0, scale: o.sc ?? 0.88, x: o.x ?? 0, y: o.y ?? 40, filter: `blur(${o.b ?? 12}px)` },
            { opacity: 1, scale: 1, x: 0, y: 0, filter: "blur(0px)", duration: o.d ?? 0.75, ease: o.e ?? "expo.out", stagger: o.s ?? 0 }, t);
        },
        // small badge or chip landing
        badge(tl, sel, t, o = {}) {
          return tl.fromTo(sel,
            { opacity: 0, scale: 0.4 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.2)", stagger: o.s ?? 0 }, t);
        },
        // exits: one smooth motion of the whole stage
        exit(tl, sel, t, kind = "blur") {
          const from = { opacity: 1, x: 0, scale: 1, filter: "blur(0px)" };
          const to = {
            blur: { opacity: 0, filter: "blur(14px)", duration: 0.36, ease: "power2.in" },
            whip: { opacity: 0, x: -340, filter: "blur(16px)", duration: 0.4, ease: "power3.in" },
            push: { opacity: 0, scale: 1.12, filter: "blur(14px)", duration: 0.4, ease: "power3.in" },
          }[kind];
          return tl.fromTo(sel, from, to, t);
        },
        // colour each .w child along a left-to-right gradient (storyboard bold lines)
        grad(sel, from = [108, 181, 205], to = [0, 165, 205]) {
          document.querySelectorAll(sel).forEach((line) => {
            const ws = line.querySelectorAll(".w");
            ws.forEach((w, k) => {
              const f = ws.length > 1 ? k / (ws.length - 1) : 1;
              const c = from.map((v, j) => Math.round(v + (to[j] - v) * f));
              w.style.color = `rgb(${c.join(",")})`;
            });
          });
        },
        // integer count-up written into an element, deterministic per frame
        count(tl, sel, t, a, b, o = {}) {
          const el = document.querySelector(sel);
          const st = { v: a };
          const fmt = (v) => (o.pre ?? "") + Math.round(v).toLocaleString("en-US") + (o.post ?? "");
          return tl.fromTo(st, { v: a }, { v: b, duration: o.d ?? 0.9, ease: o.e ?? "power2.out", onUpdate: () => (el.textContent = fmt(st.v)) }, t);
        },
      };
    </script>
