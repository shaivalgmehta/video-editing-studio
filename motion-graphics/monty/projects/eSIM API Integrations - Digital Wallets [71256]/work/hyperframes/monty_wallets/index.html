<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Monty digital-wallets kit, sampled from input/Scene 1-6.png.
         Blue leads; purple, amber and navy are the secondary colours (client note 2026-11-03); orange only for the problem scene. */
      :root {
        --ink: #0b0b0b;
        --ink2: #3d4556;
        --navy: #13294b;
        --blue-d: #0b6e99;
        --blue: #1a8fbf;
        --cyan: #00a5cd;
        --cyan-l: #c6e6f0;
        --purple: #7a58de;
        --purple-l: #ece7fc;
        --amber: #fbb02b;
        --amber-l: #fff1d2;
        --amber-d: #b06f00;
        --orange: #f4572f;
        --orange-l: #f3dcd8;
        --green: #19a464;
        --font: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #e4f0f5; font-family: var(--font); }
      #root { position: absolute; inset: 0; font-family: var(--font); }
      .ground { position: absolute; inset: 0; background: linear-gradient(180deg, #ffffff 0%, #ffffff 22%, #e9f3f7 55%, #d2e7ef 100%); }
      /* secondary colour glows behind everything */
      .glow { position: absolute; border-radius: 50%; }
      #glow-p { left: 1180px; top: -380px; width: 1100px; height: 900px; background: radial-gradient(closest-side, rgba(122, 88, 222, 0.16), rgba(122, 88, 222, 0)); }

      .stage { position: absolute; inset: 0; color: var(--ink); font-family: var(--font); }
      .cam { position: absolute; inset: 0; }
      .abs { position: absolute; }

      /* headline: Montserrat bold, second line in the cyan-to-purple accent */
      .hl { position: absolute; font-weight: 700; font-size: 80px; line-height: 1.04; letter-spacing: -0.005em; color: var(--ink); white-space: nowrap; }
      .hl .ln { position: relative; display: block; width: fit-content; }
      .hl .w { display: inline-block; white-space: pre; }
      .acc .w { background: linear-gradient(90deg, var(--cyan) 0%, #3e86d6 55%, var(--purple) 100%); background-size: var(--gw, 900px) 100%;
        background-position: var(--gx, 0px) 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
      .acc.orange .w { background: none; color: var(--orange); }

      /* icons: Font Awesome 6 Free solid as masks */
      .i { display: inline-block; width: 1em; height: 1em; flex: none; background: currentColor;
        -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
      .tile { display: flex; align-items: center; justify-content: center; flex: none; width: 64px; height: 64px; border-radius: 14px; font-size: 30px; }
      .tile.cyan { background: #dcf0f6; color: var(--cyan); }
      .tile.purple { background: var(--purple-l); color: var(--purple); }
      .tile.amber { background: var(--amber-l); color: var(--amber-d); }
      .tile.navy { background: #dde3ee; color: var(--navy); }
      .tile.orange { background: var(--orange); color: #fff; }

      /* white square cards */
      .card { position: absolute; background: #fcfdfe; border-radius: 34px; box-shadow: 0 26px 60px rgba(19, 41, 75, 0.12), 0 4px 12px rgba(19, 41, 75, 0.04); }
      .ct { font-weight: 700; font-size: 22px; color: var(--ink); line-height: 1.2; white-space: nowrap; }
      .cs { font-weight: 400; font-size: 21px; color: var(--ink2); line-height: 1.2; white-space: nowrap; margin-top: 3px; }

      /* phone: black bezel with notch */
      .phone { position: absolute; width: 500px; height: 1010px; border-radius: 80px; padding: 18px; background: #1d1d20;
        box-shadow: inset 0 0 0 3px #3b3b40, 0 40px 90px rgba(19, 41, 75, 0.22); }
      .phone .scr { position: relative; width: 100%; height: 100%; border-radius: 64px; overflow: hidden; background: #fbfcfd; }
      .phone .notch { position: absolute; top: 0; left: 50%; margin-left: -120px; width: 240px; height: 50px; border-radius: 0 0 26px 26px; background: #1d1d20; z-index: 5; }
      .phone .notch::before { content: ""; position: absolute; left: 82px; top: 16px; width: 76px; height: 5px; border-radius: 3px; background: #3b3b40; }
      .phone .notch::after { content: ""; position: absolute; left: 172px; top: 12px; width: 13px; height: 13px; border-radius: 50%; background: #1f3e8a; box-shadow: 0 0 0 3px #2a2a2e; }
      .phone .btn-l { position: absolute; left: -5px; width: 5px; border-radius: 3px 0 0 3px; background: #8e8e93; }
      .phone .btn-r { position: absolute; right: -5px; top: 250px; width: 5px; height: 110px; border-radius: 0 3px 3px 0; background: #8e8e93; }
      .wallet-head { position: absolute; left: 0; right: 0; top: 0; height: 300px; color: #fff;
        background: linear-gradient(170deg, #0b4f7c 0%, #0b6e99 45%, #3a94b9 100%); }
      .wallet-head .wh1 { position: absolute; left: 44px; top: 122px; display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 22px; }
      .wallet-head .wh2 { position: absolute; left: 44px; top: 166px; font-weight: 400; font-size: 21px; }
      .wallet-head .wh3 { position: absolute; left: 42px; top: 196px; font-weight: 700; font-size: 52px; letter-spacing: -0.01em; }
      .ph-label { position: absolute; left: 44px; font-weight: 700; font-size: 21px; color: var(--ink); }
      .ph-row { position: absolute; left: 36px; right: 36px; display: flex; align-items: center; gap: 22px; padding: 0 30px; border-radius: 18px; }
      .pbtn { display: flex; align-items: center; justify-content: center; height: 82px; border-radius: 41px; color: #fff; font-weight: 600; font-size: 24px;
        background: linear-gradient(90deg, var(--navy) 0%, #0b6e99 60%, var(--purple) 130%); }
    </style>
    <script>
      // Shared motion for every scene. Pure functions of the scene timeline.
      // v3 motion, after Rosette's AE grammar: the film is one canvas and the camera moves.
      // - scene changes are camera pans (left through the story, up for the close): both scenes move together, nothing fades
      // - inside a scene, one thing at a time in reading order, each next to the last, on its VO word, with short travel
      // - holds keep a slow drift so the frame never goes dead
      window.KIT = {
        PAN: 0.8,
        // headline line or small element: short fade-and-slide
        build(tl, sel, t, o = {}) {
          return tl.fromTo(sel, { opacity: 0, x: o.x ?? 0, y: o.y ?? 18 },
            { opacity: 1, x: 0, y: 0, duration: o.d ?? 0.55, ease: "power2.out", stagger: o.s ?? 0 }, t);
        },
        // camera arriving: the scene slides in from the right (or from below) as the last one leaves
        panIn(tl, sel, dir = "x") {
          const from = dir === "x" ? { x: 1920 } : { y: 1080 };
          return tl.fromTo(sel, from, { x: 0, y: 0, duration: KIT.PAN, ease: "power3.inOut" }, 0);
        },
        panOut(tl, sel, t, dir = "x") {
          const to = dir === "x" ? { x: -1920 } : { y: -1080 };
          return tl.to(sel, { ...to, duration: KIT.PAN, ease: "power3.inOut" }, t);
        },
        // slow camera drift across the whole scene
        drift(tl, sel, dur, o = {}) {
          // centred glide (+d to -d) so nothing nears the frame edge; ~2.5 px a frame, like Rosette's holds
          const dx = o.x ?? 40, dy = o.y ?? 0;
          return tl.fromTo(sel, { x: dx, y: dy, scale: 1 }, { x: -dx, y: -dy, scale: o.sc ?? 1, duration: dur, ease: "none" }, 0);
        },
        // gradient words: each word shows its slice of one line-wide gradient
        acc(sel) {
          document.querySelectorAll(sel).forEach((ln) => {
            const W = ln.getBoundingClientRect().width || 900;
            ln.style.setProperty("--gw", W + "px");
            let x = 0;
            ln.querySelectorAll(".w").forEach((w) => { w.style.setProperty("--gx", -x + "px"); x += w.getBoundingClientRect().width; });
          });
        },
      };
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="42.6" data-width="1920" data-height="1080">
      <div class="ground"></div>
      <div class="glow" id="glow-p"></div>

      <!-- Scenes. VO starts at 0.3 s; slots overlap by 0.8 s: the camera pan between scenes ends ~0.2-0.6 s after the next VO line starts. -->
      <div id="s01" data-composition-id="s01" data-composition-src="compositions/s01.html" data-start="0" data-duration="3.95" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s02" data-composition-id="s02" data-composition-src="compositions/s02.html" data-start="3.15" data-duration="4.2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s03" data-composition-id="s03" data-composition-src="compositions/s03.html" data-start="6.55" data-duration="7.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s04" data-composition-id="s04" data-composition-src="compositions/s04.html" data-start="13.25" data-duration="6.05" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s05" data-composition-id="s05" data-composition-src="compositions/s05.html" data-start="18.5" data-duration="5.85" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s06" data-composition-id="s06" data-composition-src="compositions/s06.html" data-start="23.55" data-duration="7.7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s07" data-composition-id="s07" data-composition-src="compositions/s07.html" data-start="30.45" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s08" data-composition-id="s08" data-composition-src="compositions/s08.html" data-start="35.25" data-duration="7.35" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="caps" data-composition-id="caps" data-composition-src="compositions/caps.html" data-start="0" data-duration="42.6" data-track-index="3" data-track-kind="captions" data-width="1920" data-height="1080"></div>

      <!-- Sound: VO at -16 LUFS; Pop Track 03 (Mixkit 729) with one intro bar repeated so the beat lands on "With the Monty eSIM API",
           then a jump to the track's last 3 bars so its final hit lands at 40.2 s, after "wallet." -->
      <audio id="vo" class="clip" src="assets/audio/vo.wav" data-start="0.3" data-duration="39.7" data-track-index="10" data-volume="1"></audio>
      <audio id="music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="42.6" data-track-index="11" data-volume="1" data-fade-out="1.4"></audio>

      <!-- whooshes on the camera pans (file peak 0.16 s, placed at the pan's fastest point) -->
      <audio id="fx-wh1" class="clip" src="assets/audio/sfx-whoosh-short.mp3" data-start="3.39" data-duration="0.5" data-track-index="12" data-volume="0.2"></audio>
      <audio id="fx-wh2" class="clip" src="assets/audio/sfx-whoosh.mp3" data-start="6.79" data-duration="0.57" data-track-index="12" data-volume="0.2"></audio>
      <audio id="fx-wh3" class="clip" src="assets/audio/sfx-whoosh-short.mp3" data-start="13.49" data-duration="0.5" data-track-index="12" data-volume="0.18"></audio>
      <audio id="fx-wh7" class="clip" src="assets/audio/sfx-whoosh-short.mp3" data-start="18.74" data-duration="0.5" data-track-index="12" data-volume="0.15"></audio>
      <audio id="fx-wh4" class="clip" src="assets/audio/sfx-whoosh.mp3" data-start="23.79" data-duration="0.57" data-track-index="12" data-volume="0.2" data-playback-rate="1.1"></audio>
      <audio id="fx-wh5" class="clip" src="assets/audio/sfx-whoosh-short.mp3" data-start="30.69" data-duration="0.5" data-track-index="12" data-volume="0.18"></audio>
      <audio id="fx-wh6" class="clip" src="assets/audio/sfx-whoosh.mp3" data-start="35.49" data-duration="0.57" data-track-index="12" data-volume="0.18" data-playback-rate="0.92"></audio>

      <!-- impacts: "Revenue lost" lands, the trip pin drops -->
      <audio id="fx-st1" class="clip" src="assets/audio/sfx-impact-bass-1.mp3" data-start="6.22" data-duration="0.9" data-track-index="13" data-volume="0.35"></audio>
      <audio id="fx-st2" class="clip" src="assets/audio/sfx-impact-bass-1.mp3" data-start="10.62" data-duration="0.9" data-track-index="14" data-volume="0.25"></audio>

      <!-- the tap -->
      <audio id="fx-c1" class="clip" src="assets/audio/sfx-click-soft.mp3" data-start="15.98" data-duration="0.4" data-track-index="15" data-volume="0.55"></audio>

      <!-- sparkle on the address -->
      <audio id="fx-sp" class="clip" src="assets/audio/sfx-sparkle.mp3" data-start="40.1" data-duration="1.8" data-track-index="16" data-volume="0.2"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
