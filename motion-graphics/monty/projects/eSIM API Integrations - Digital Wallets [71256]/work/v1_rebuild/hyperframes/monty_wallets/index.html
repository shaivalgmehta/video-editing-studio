<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Monty digital-wallets kit, sampled from input/Scene 1-6.png.
         Blue leads; purple, amber and navy are the secondary colours (client note 2026-11-03); orange only for the problem scene. */
      :root {
        --ink: #0b0b0b;
        --ink2: #3d4556;
        --navy: #13294b;
        --blue-d: #0b6e99;
        --blue: #1a8fbf;
        --cyan: #00a5cd;
        --cyan-l: #c6e6f0;
        --purple: #7a58de;
        --purple-l: #ece7fc;
        --amber: #fbb02b;
        --amber-l: #fff1d2;
        --amber-d: #b06f00;
        --orange: #f4572f;
        --orange-l: #f3dcd8;
        --green: #19a464;
        --font: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #e4f0f5; font-family: var(--font); }
      #root { position: absolute; inset: 0; font-family: var(--font); }
      .ground { position: absolute; inset: 0; background: linear-gradient(180deg, #ffffff 0%, #ffffff 22%, #e9f3f7 55%, #d2e7ef 100%); }
      /* secondary colour glows behind everything */
      .glow { position: absolute; border-radius: 50%; }
      #glow-p { left: 1180px; top: -380px; width: 1100px; height: 900px; background: radial-gradient(closest-side, rgba(122, 88, 222, 0.16), rgba(122, 88, 222, 0)); }

      .stage { position: absolute; inset: 0; color: var(--ink); font-family: var(--font); }
      .abs { position: absolute; }

      /* headline: Montserrat bold, second line in the cyan-to-purple accent */
      .hl { position: absolute; font-weight: 700; font-size: 80px; line-height: 1.04; letter-spacing: -0.005em; color: var(--ink); white-space: nowrap; }
      .hl .ln { position: relative; display: block; width: fit-content; }
      .hl .w { display: inline-block; white-space: pre; }
      .acc .w { background: linear-gradient(90deg, var(--cyan) 0%, #3e86d6 55%, var(--purple) 100%); background-size: var(--gw, 900px) 100%;
        background-position: var(--gx, 0px) 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
      .acc.orange .w { background: none; color: var(--orange); }

      /* icons: Font Awesome 6 Free solid as masks */
      .i { display: inline-block; width: 1em; height: 1em; flex: none; background: currentColor;
        -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
      .tile { display: flex; align-items: center; justify-content: center; flex: none; width: 64px; height: 64px; border-radius: 14px; font-size: 30px; }
      .tile.cyan { background: #dcf0f6; color: var(--cyan); }
      .tile.purple { background: var(--purple-l); color: var(--purple); }
      .tile.amber { background: var(--amber-l); color: var(--amber-d); }
      .tile.navy { background: #dde3ee; color: var(--navy); }
      .tile.orange { background: var(--orange); color: #fff; }

      /* white square cards */
      .card { position: absolute; background: #fcfdfe; border-radius: 34px; box-shadow: 0 26px 60px rgba(19, 41, 75, 0.12), 0 4px 12px rgba(19, 41, 75, 0.04); }
      .ct { font-weight: 700; font-size: 22px; color: var(--ink); line-height: 1.2; white-space: nowrap; }
      .cs { font-weight: 400; font-size: 21px; color: var(--ink2); line-height: 1.2; white-space: nowrap; margin-top: 3px; }

      /* phone: black bezel with notch */
      .phone { position: absolute; width: 500px; height: 1010px; border-radius: 80px; padding: 18px; background: #1d1d20;
        box-shadow: inset 0 0 0 3px #3b3b40, 0 40px 90px rgba(19, 41, 75, 0.22); }
      .phone .scr { position: relative; width: 100%; height: 100%; border-radius: 64px; overflow: hidden; background: #fbfcfd; }
      .phone .notch { position: absolute; top: 0; left: 50%; margin-left: -120px; width: 240px; height: 50px; border-radius: 0 0 26px 26px; background: #1d1d20; z-index: 5; }
      .phone .notch::before { content: ""; position: absolute; left: 82px; top: 16px; width: 76px; height: 5px; border-radius: 3px; background: #3b3b40; }
      .phone .notch::after { content: ""; position: absolute; left: 172px; top: 12px; width: 13px; height: 13px; border-radius: 50%; background: #1f3e8a; box-shadow: 0 0 0 3px #2a2a2e; }
      .phone .btn-l { position: absolute; left: -5px; width: 5px; border-radius: 3px 0 0 3px; background: #8e8e93; }
      .phone .btn-r { position: absolute; right: -5px; top: 250px; width: 5px; height: 110px; border-radius: 0 3px 3px 0; background: #8e8e93; }
      .wallet-head { position: absolute; left: 0; right: 0; top: 0; height: 300px; color: #fff;
        background: linear-gradient(170deg, #0b4f7c 0%, #0b6e99 45%, #3a94b9 100%); }
      .wallet-head .wh1 { position: absolute; left: 44px; top: 122px; display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 22px; }
      .wallet-head .wh2 { position: absolute; left: 44px; top: 166px; font-weight: 400; font-size: 21px; }
      .wallet-head .wh3 { position: absolute; left: 42px; top: 196px; font-weight: 700; font-size: 52px; letter-spacing: -0.01em; }
      .ph-label { position: absolute; left: 44px; font-weight: 700; font-size: 21px; color: var(--ink); }
      .ph-row { position: absolute; left: 36px; right: 36px; display: flex; align-items: center; gap: 22px; padding: 0 30px; border-radius: 18px; }
      .pbtn { display: flex; align-items: center; justify-content: center; height: 82px; border-radius: 41px; color: #fff; font-weight: 600; font-size: 24px;
        background: linear-gradient(90deg, var(--navy) 0%, #0b6e99 60%, var(--purple) 130%); }
    </style>
    <script>
      // Shared motion for every scene. Pure functions of the scene timeline.
      window.KIT = {
        // headline words: blur-free rise on a long tail
        rise(tl, sel, t, o = {}) {
          return tl.fromTo(sel, { opacity: 0, y: o.y ?? 50 },
            { opacity: 1, y: 0, duration: o.d ?? 0.7, ease: "expo.out", stagger: o.s ?? 0.07 }, t);
        },
        // card arriving: scale + lift, settles with a little overshoot
        card(tl, sel, t, o = {}) {
          return tl.fromTo(sel, { opacity: 0, scale: o.sc ?? 0.7, x: o.x ?? 0, y: o.y ?? 60, rotation: o.r ?? 0 },
            { opacity: 1, scale: 1, x: 0, y: 0, rotation: 0, duration: o.d ?? 0.65, ease: o.e ?? "back.out(1.6)", stagger: o.s ?? 0 }, t);
        },
        pop(tl, sel, t, o = {}) {
          return tl.fromTo(sel, { opacity: 0, scale: 0.4 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.2)", stagger: o.s ?? 0 }, t);
        },
        // phone sliding in from an edge
        phone(tl, sel, t, o = {}) {
          return tl.fromTo(sel, { opacity: 0, x: o.x ?? 0, y: o.y ?? 0 }, { opacity: 1, x: 0, y: 0, duration: o.d ?? 0.9, ease: "expo.out" }, t);
        },
        // gentle float on a card for the rest of the scene (one slow drift, no loop)
        drift(tl, sel, t, dur, dy = -14) {
          return tl.to(sel, { y: `+=${dy}`, duration: dur, ease: "sine.inOut" }, t);
        },
        // gradient words: each word shows its slice of one line-wide gradient
        acc(sel) {
          document.querySelectorAll(sel).forEach((ln) => {
            const W = ln.getBoundingClientRect().width || 900;
            ln.style.setProperty("--gw", W + "px");
            let x = 0;
            ln.querySelectorAll(".w").forEach((w) => { w.style.setProperty("--gx", -x + "px"); x += w.getBoundingClientRect().width; });
          });
        },
        // exits: quick and early so a scene is clear before the next one builds
        out(tl, sel, t, o = {}) {
          return tl.to(sel, { opacity: 0, x: o.x ?? 0, y: o.y ?? 0, scale: o.sc ?? 1,
            duration: 0.3, ease: "power2.in", stagger: o.s ?? 0 }, t);
        },
        count(tl, sel, t, a, b, o = {}) {
          const el = document.querySelector(sel);
          const st = { v: a };
          const dp = o.dp ?? 0;
          const fmt = (v) => (o.pre ?? "") + v.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp }) + (o.post ?? "");
          el.textContent = fmt(a);
          return tl.fromTo(st, { v: a }, { v: b, duration: o.d ?? 0.9, ease: o.e ?? "power2.out",
            onUpdate: () => (el.textContent = fmt(Math.round(st.v * 10 ** dp) / 10 ** dp)) }, t);
        },
      };
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="42.6" data-width="1920" data-height="1080">
      <div class="ground"></div>
      <div class="glow" id="glow-p"></div>

      <!-- Scenes. VO starts at 0.3 s; each slot opens ~0.25 s before its line and overlaps the next by 0.45 s for the exit. -->
      <div id="s01" data-composition-id="s01" data-composition-src="compositions/s01.html" data-start="0" data-duration="3.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s02" data-composition-id="s02" data-composition-src="compositions/s02.html" data-start="3.45" data-duration="3.85" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s03" data-composition-id="s03" data-composition-src="compositions/s03.html" data-start="6.85" data-duration="7.15" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s04" data-composition-id="s04" data-composition-src="compositions/s04.html" data-start="13.55" data-duration="5.7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s05" data-composition-id="s05" data-composition-src="compositions/s05.html" data-start="18.8" data-duration="5.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s06" data-composition-id="s06" data-composition-src="compositions/s06.html" data-start="23.65" data-duration="7.55" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s07" data-composition-id="s07" data-composition-src="compositions/s07.html" data-start="30.75" data-duration="5.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s08" data-composition-id="s08" data-composition-src="compositions/s08.html" data-start="35.55" data-duration="7.05" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="caps" data-composition-id="caps" data-composition-src="compositions/caps.html" data-start="0" data-duration="42.6" data-track-index="3" data-track-kind="captions" data-width="1920" data-height="1080"></div>

      <!-- Sound: VO at -16 LUFS; Pop Track 03 (Mixkit 729) with one intro bar repeated so the beat lands on "With the Monty eSIM API",
           then a jump to the track's last 3 bars so its final hit lands at 40.2 s, after "wallet." -->
      <audio id="vo" class="clip" src="assets/audio/vo.wav" data-start="0.3" data-duration="39.7" data-track-index="10" data-volume="1"></audio>
      <audio id="music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="42.6" data-track-index="11" data-volume="1" data-fade-out="1.4"></audio>

      <!-- whooshes on the exits (peak 0.16 s into the file) -->

      <audio id="fx-wh2" class="clip" src="assets/audio/sfx-whoosh.mp3" data-start="6.75" data-duration="0.57" data-track-index="12" data-volume="0.2"></audio>
      <audio id="fx-wh3" class="clip" src="assets/audio/sfx-whoosh-short.mp3" data-start="13.45" data-duration="0.5" data-track-index="12" data-volume="0.18"></audio>
      <audio id="fx-wh4" class="clip" src="assets/audio/sfx-whoosh.mp3" data-start="23.55" data-duration="0.57" data-track-index="12" data-volume="0.2" data-playback-rate="1.1"></audio>
      <audio id="fx-wh5" class="clip" src="assets/audio/sfx-whoosh-short.mp3" data-start="30.65" data-duration="0.5" data-track-index="12" data-volume="0.18"></audio>
      <audio id="fx-wh6" class="clip" src="assets/audio/sfx-whoosh.mp3" data-start="35.45" data-duration="0.57" data-track-index="12" data-volume="0.18" data-playback-rate="0.92"></audio>

      <!-- impacts: "Revenue lost" lands, the trip pin drops -->
      <audio id="fx-st1" class="clip" src="assets/audio/sfx-impact-bass-1.mp3" data-start="6.2" data-duration="0.9" data-track-index="13" data-volume="0.35"></audio>
      <audio id="fx-st2" class="clip" src="assets/audio/sfx-impact-bass-1.mp3" data-start="10.62" data-duration="0.9" data-track-index="14" data-volume="0.25"></audio>

      <!-- taps -->
      <audio id="fx-c1" class="clip" src="assets/audio/sfx-click-soft.mp3" data-start="15.98" data-duration="0.4" data-track-index="15" data-volume="0.55"></audio>
      <audio id="fx-c2" class="clip" src="assets/audio/sfx-click-soft.mp3" data-start="22.63" data-duration="0.4" data-track-index="15" data-volume="0.5"></audio>

      <!-- pops on cards landing (peak 0.12 s into the file) -->
      <audio id="fx-p1" class="clip" src="assets/audio/sfx-pop.mp3" data-start="1.74" data-duration="0.6" data-track-index="16" data-volume="0.3"></audio>
      <audio id="fx-p2" class="clip" src="assets/audio/sfx-pop.mp3" data-start="2.06" data-duration="0.6" data-track-index="17" data-volume="0.3" data-playback-rate="1.08"></audio>
      <audio id="fx-p3" class="clip" src="assets/audio/sfx-pop.mp3" data-start="2.41" data-duration="0.6" data-track-index="16" data-volume="0.3" data-playback-rate="1.16"></audio>
      <audio id="fx-p4" class="clip" src="assets/audio/sfx-pop.mp3" data-start="11.53" data-duration="0.6" data-track-index="16" data-volume="0.35"></audio>
      <audio id="fx-p5" class="clip" src="assets/audio/sfx-pop.mp3" data-start="16.65" data-duration="0.6" data-track-index="16" data-volume="0.3"></audio>
      <audio id="fx-p6" class="clip" src="assets/audio/sfx-pop.mp3" data-start="17.45" data-duration="0.6" data-track-index="17" data-volume="0.3" data-playback-rate="1.1"></audio>
      <audio id="fx-p7" class="clip" src="assets/audio/sfx-pop.mp3" data-start="24.05" data-duration="0.6" data-track-index="16" data-volume="0.3"></audio>
      <audio id="fx-p8" class="clip" src="assets/audio/sfx-pop.mp3" data-start="25.9" data-duration="0.6" data-track-index="17" data-volume="0.3" data-playback-rate="1.08"></audio>
      <audio id="fx-p9" class="clip" src="assets/audio/sfx-pop.mp3" data-start="27.8" data-duration="0.6" data-track-index="16" data-volume="0.3" data-playback-rate="1.16"></audio>
      <audio id="fx-sp" class="clip" src="assets/audio/sfx-sparkle.mp3" data-start="40.1" data-duration="1.8" data-track-index="16" data-volume="0.2"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
