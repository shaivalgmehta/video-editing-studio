<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #pan { position: absolute; inset: 0; z-index: 1; }
      #cam { position: absolute; inset: 0; }
      .bw { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
      #aroll { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- TRRS 16:9 TEASER TEMPLATE (from the CD-approved S6E15 teaser v7, ~60 s). Copy the folder to
         episodes/<SxEyy_guest>/work/hyperframes/teaser and follow the trrs-teaser skill.
         Structure (master seconds, S6E15 values kept as the example):
           0-4.9 HOOK guest's boldest line (hook.html) | 4.9-9.5 HOST question (host.html, ~2.4 s graphic) |
           9.5-12.5 TITLE: client video cover on the music drop (title.html, A-roll black) |
           12.5-53.25 BODY: 5-7 one-line beats, each with a graphic that EXPLAINS the line, whip pans between sections |
           53.25-55.567 CUT-OFF: a line that stops mid-sentence (payoff withheld) | 55.8-60 END CARD (endcard.html).
         A-roll = ONE pre-cut 1920x1080 file with the crops baked in (black in the title and end gaps).
         Layering: A-roll 1 / talking-head graphics 3 / full cards 5 / captions 6 / glitch bursts 8.
         Same gotchas as the reels: host id = data-composition-id; timed elements need class="clip" + data-start + data-duration;
         <audio> needs id + data-duration; no tweening top/left/width/height. -->
    <div id="root" data-composition-id="main" data-motion-blur="on" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div id="pan">
      <div id="cam">
        <video id="aroll" class="clip" src="assets/video/aroll.mp4" data-start="0" data-duration="60" data-track-index="0" muted playsinline
          data-color-grading='{"preset":null,"intensity":1,"adjust":{"exposure":0.04,"contrast":0.14,"highlights":-0.5,"shadows":0.32,"whites":-0.18,"blacks":-0.04,"temperature":0.04,"tint":0,"vibrance":0.06,"saturation":-0.04},"details":{"vignette":0.32,"vignetteMidpoint":0.5,"vignetteRoundness":0,"vignetteFeather":0.7,"grain":0.14,"grainSize":0.3,"grainRoughness":0.5},"lut":null,"colorSpace":"rec709"}'></video>
        <!-- B&W FLASH: a 0.2 s desaturated copy of the A-roll at each section whip (one per WHIPS entry below; alternate track 1/2). -->
        <video id="bw0" class="clip bw" src="assets/video/aroll.mp4" data-start="16.9" data-duration="0.2" data-media-start="16.9" data-track-index="1" muted playsinline
          data-color-grading='{"preset":null,"intensity":1,"adjust":{"exposure":0.04,"contrast":0.32,"highlights":-0.5,"shadows":0.32,"whites":-0.18,"blacks":-0.04,"temperature":0.04,"tint":0,"vibrance":0.06,"saturation":-1},"details":{"vignette":0.32,"vignetteMidpoint":0.5,"vignetteRoundness":0,"vignetteFeather":0.7,"grain":0.14,"grainSize":0.3,"grainRoughness":0.5},"lut":null,"colorSpace":"rec709"}'></video>
      </div>
      </div>

      <!-- Talking-head graphics: one scene per segment, text on the side away from the speaker. -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.90" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="host" data-composition-id="host" data-composition-src="compositions/host.html" data-start="4.90" data-duration="2.40" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html" data-start="9.50" data-duration="3.00" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>
      <!-- BODY BEATS: add one scene file per beat (copy handwrite.html / hook.html as a starting point). Example: -->
      <div id="handwrite" data-composition-id="handwrite" data-composition-src="compositions/handwrite.html" data-start="32.70" data-duration="5.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="55.80" data-duration="4.20" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="60" data-track-index="5" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 6"></div>
      <div id="glitch" data-composition-id="glitch" data-composition-src="compositions/glitch.html" data-start="0" data-duration="60" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 8"></div>

      <!-- SOUND. voice.wav = the cut dialogue (-16 LUFS). music_ducked.wav = the episode's bed after tools/duck.sh; hits.wav =
           un-ducked hits/risers/booms on the beat map (music is rebuilt per teaser, see the trrs-teaser skill).
           SFX: whoosh into the host + title, glitch on each glitch burst, type on any search-bar typing, click on card beats. -->
      <audio id="voice" class="clip" src="assets/audio/voice.wav" data-start="0" data-duration="60" data-track-index="10" data-volume="1"></audio>
      <audio id="music" class="clip" src="assets/audio/music_ducked.wav" data-start="0" data-duration="60" data-track-index="11" data-volume="1"></audio>
      <audio id="hits" class="clip" src="assets/audio/hits.wav" data-start="0" data-duration="60" data-track-index="12" data-volume="1"></audio>
      <audio id="sfx-wh1" class="clip" src="assets/sfx/whoosh.wav" data-start="4.70" data-duration="0.5" data-track-index="13" data-volume="0.35"></audio>
      <audio id="sfx-gl1" class="clip" src="assets/sfx/glitch.wav" data-start="4.80" data-duration="0.42" data-track-index="14" data-volume="0.3"></audio>
      <audio id="sfx-wh2" class="clip" src="assets/sfx/whoosh.wav" data-start="12.30" data-duration="0.5" data-track-index="13" data-volume="0.35"></audio>
      <audio id="sfx-gl2" class="clip" src="assets/sfx/glitch.wav" data-start="12.40" data-duration="0.42" data-track-index="14" data-volume="0.3"></audio>
      <audio id="sfx-gl3" class="clip" src="assets/sfx/glitch.wav" data-start="30.25" data-duration="0.42" data-track-index="14" data-volume="0.3"></audio>
      <audio id="sfx-gl4" class="clip" src="assets/sfx/glitch.wav" data-start="44.15" data-duration="0.42" data-track-index="14" data-volume="0.3"></audio>
      <audio id="sfx-gl5" class="clip" src="assets/sfx/glitch.wav" data-start="53.15" data-duration="0.42" data-track-index="15" data-volume="0.25"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // CAMERA: shots are crops baked into aroll.mp4 (see EDL). These eased zooms steer the eye: creep in, slam in
      // (0.3 s expo.out) on the key word, pull out to reveal. Origins per crop type (S6E15 values; re-measure):
      const GCU = "61% 31%", GMED = "62% 28%", HMED = "48% 25%", HCU = "37% 30%", WIDE = "50% 45%";
      const Z = (t, d, a, b, o, ease) => tl.fromTo("#cam", { scale: a, transformOrigin: o }, { scale: b, duration: d, ease, immediateRender: false }, t);
      tl.set("#cam", { scale: 1, transformOrigin: GCU }, 0);
      Z(0.00, 1.29, 1.00, 1.05, GCU, "none");          // HOOK: creep
      Z(1.29, 0.30, 1.05, 1.16, GCU, "expo.out");      // slam on the key word
      Z(2.45, 0.60, 1.16, 1.00, GCU, "power2.inOut");  // pull out
      Z(4.90, 2.40, 1.00, 1.10, HMED, "power1.inOut"); // HOST: slow push
      Z(7.30, 1.00, 1.22, 1.00, WIDE, "expo.out");     // reveal both
      Z(8.30, 1.20, 1.00, 1.07, WIDE, "power2.in");    // push into the riser before the title
      // BODY: add per-beat zooms here (tl.set to reset scale on each hard cut)
      Z(53.25, 2.317, 1.00, 1.20, GCU, "power1.in");   // CUT-OFF: slow push as the sentence breaks off
      // PAN layer: slow lateral drift on every talking-head stretch (alternating), and a whip pan across each section
      // change (+ a B&W flash + glitch burst) so the middle plays as separate beats.
      const SEGS = [[0, 4.90], [4.90, 7.30], [7.30, 9.50], [12.50, 16.90], [16.90, 53.25], [53.25, 55.567]];
      const WHIPS = [16.90];
      SEGS.forEach(([a, b], i) => {
        const d = i % 2 ? 1 : -1;
        const inW = WHIPS.includes(a), outW = WHIPS.includes(b);
        const t0 = a + (inW ? 0.3 : 0), t1 = b - (outW ? 0.16 : 0);
        tl.fromTo("#pan", { x: inW ? 0 : -36 * d, scale: 1.06 }, { x: 36 * d, scale: 1.06, duration: t1 - t0, ease: "none", immediateRender: false }, t0);
      });
      tl.set("#pan", { x: 0, scale: 1 }, 9.50);
      tl.set("#pan", { x: 0, scale: 1 }, 55.567);
      WHIPS.forEach((t, i) => {
        const d = i % 2 ? -1 : 1;
        tl.to("#pan", { x: -260 * d, scale: 1.3, duration: 0.16, ease: "power3.in" }, t - 0.16);
        tl.fromTo("#pan", { x: 260 * d, scale: 1.3 }, { x: 0, scale: 1.06, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
