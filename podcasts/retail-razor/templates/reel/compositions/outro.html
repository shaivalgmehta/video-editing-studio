  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Wipe position c: 0 = lower-left corner, 2 = upper-right corner (c = x/1080 + (1920-y)/1920).
      // Ground clip-path is the half-plane c' <= c; one unit of c = 941.3 px along the blade's normal.
      const clip = (c) => `polygon(-100% ${-c * 100}%, 200% ${300 - c * 100}%, 200% 400%, -100% 400%)`;
      const bladeY = (c) => -(c - 1) * 941.3; // local y inside the rotated wrapper; negative = toward upper-right
      const C_MID = 0.83, C_END = 2.14, T_PEAK = 0.12, T_END = 0.40;

      // 0.00-0.40 razor slash. Fastest frame at t = 0.12 (sfx "shing" cue): ease-in to the peak, matched-speed ease-out after.
      tl.fromTo("#o-ground", { clipPath: clip(0) }, { clipPath: clip(C_MID), duration: T_PEAK, ease: "power2.in" }, 0);
      tl.to("#o-ground", { clipPath: clip(C_END), duration: T_END - T_PEAK, ease: "power3.out" }, T_PEAK);
      tl.fromTo("#o-blade", { y: bladeY(0) }, { y: bladeY(C_MID), duration: T_PEAK, ease: "power2.in" }, 0);
      tl.to("#o-blade", { y: bladeY(C_END), duration: T_END - T_PEAK, ease: "power3.out" }, T_PEAK);
      tl.to("#o-blade", { opacity: 0, duration: 0.10, ease: "power2.in" }, 0.32);

      // Glow: lands with the wipe, then a slow drift through the hold
      tl.fromTo("#o-glow-a", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.05);
      tl.fromTo("#o-glow-b", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.fromTo("#o-glow-a", { x: 0, y: 0 }, { x: 70, y: 50, duration: 2.6, ease: "sine.inOut" }, 0.4);
      tl.fromTo("#o-glow-b", { x: 0, y: 0 }, { x: -60, y: -40, duration: 2.6, ease: "sine.inOut" }, 0.4);

      // 0.35-1.2 logo lands, tagline follows
      tl.fromTo("#o-logo", { opacity: 0, scale: 0.92, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.35);
      tl.fromTo("#o-tag", { opacity: 0, y: 10, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0.62);

      // 0.7-1.5 label, title, show line
      tl.fromTo("#o-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 0.7);
      tl.fromTo("#o-label", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 0.75);
      tl.fromTo("#o-title", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.88);
      tl.fromTo("#o-show", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 1.2);

      // 1.1-1.8 platform icons stagger up
      tl.fromTo("#o-icons img", { opacity: 0, y: 40, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, stagger: 0.07, ease: "expo.out" }, 1.15);

      // 1.5-2.0 follow pill
      tl.fromTo("#o-follow", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 1.5);

      // Hold 2.0-3.0 (glow drift only). No exit: the reel loops.
      window.__timelines["outro"] = tl;
    })();
  </script>
