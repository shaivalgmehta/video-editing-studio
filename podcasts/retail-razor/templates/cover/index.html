<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #120a07; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #120a07; }
    </style>
  </head>
  <body>
    <!-- TRRS S0E00 reel covers. One cover per second (in cover-number order); export stills at (slot + 0.5) s.
         GENERATED by tools/gen.py from covers.json: do not hand-edit, change the config and re-run. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1080" data-height="1920">
      <div id="c1" data-composition-id="c1" data-composition-src="compositions/c1.html" data-start="0" data-duration="1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="c2" data-composition-id="c2" data-composition-src="compositions/c2.html" data-start="1" data-duration="1" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
